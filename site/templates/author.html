{% extends "base.html" %}
{% block title %}{{ author.name }}{% endblock %}
{% block content %}
<div class="author-details">
  <h1 class="author-title">{{ author.name }}</h1>
  <p>Born: <span class="author-born-date">{{ author.born }}</span> in <span class="author-born-location">{{ author.place }}</span></p>
  <div class="author-description">{{ author.bio }}</div>
  <h2>{{ quotes|length }} quotes</h2>
  <ul>{% for q in quotes %}<li class="text">{{ q.text }}</li>{% endfor %}</ul>
</div>
{% endblock %}
